<!-- index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Clock</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container">
    <header class="topbar">
      <h1 aria-label="Digital Clock">🕒 Digital Clock</h1>
      <div class="controls">
        <label class="switch">
          <input type="checkbox" id="formatToggle" aria-label="Toggle 24 hour format" />
          <span>24h</span>
        </label>
        <button id="themeToggle" class="btn" aria-pressed="false">Dark</button>
      </div>
    </header>

    <section class="clock" aria-live="polite">
      <div class="time" id="time">--:--:--</div>
      <div class="date" id="date">Loading…</div>
    </section>

    <footer class="footer">
      <small>Format & theme are saved in your browser.</small>
    </footer>
  </main>

  <script src="./script.js" defer></script>
</body>
</html>
